<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>乳糖の一点</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--muro:#12233A;--muro2:#1B3050;--line:#2B4568;--kome:#F4EFE2;--sub:#93A6BE;
  --kouji:#E8B33A;--ame:#7FD1B9;--san:#F07A4B;--shi:#4C5F76;--ao:#8FB8E8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--muro);color:var(--kome);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
  display:flex;justify-content:center;padding:20px 16px 32px;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:620px;display:flex;flex-direction:column;gap:14px}
header{border-bottom:1px solid var(--line);padding-bottom:13px}
.eyebrow{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.18em;color:var(--kouji)}
h1{font-family:"Shippori Mincho B1",serif;font-size:30px;font-weight:700;letter-spacing:.04em;margin-top:6px}
.lede{color:var(--sub);font-size:13.5px;line-height:1.7;margin-top:8px}

.who{border:1px solid var(--line);background:var(--muro2);border-left:3px solid var(--kouji);
  padding:13px 15px;border-radius:2px}
.who .r{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--kouji)}
.who .n{font-family:"Shippori Mincho B1",serif;font-size:18px;margin-top:4px}
.who .d{font-size:12.5px;color:var(--sub);line-height:1.7;margin-top:6px}
.who .t{font-family:"DM Mono",monospace;font-size:11.5px;color:var(--ame);margin-top:7px}

.stage{position:relative;border:1px solid var(--line);border-radius:3px;background:#0A1524;overflow:hidden}
canvas{display:block;width:100%;height:270px}

.ctl{display:flex;flex-direction:column;gap:11px}
.row .l{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.13em;color:var(--sub);margin-bottom:7px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.opt{background:var(--muro2);border:1px solid var(--line);border-radius:2px;padding:10px 6px;
  cursor:pointer;color:var(--sub);font-family:inherit;text-align:center;transition:all .15s}
.opt .t{font-size:12.5px;font-weight:500}
.opt .s{font-family:"DM Mono",monospace;font-size:9.5px;color:var(--shi);margin-top:3px}
.opt.sel{border-color:var(--kouji);color:var(--kome);background:#22375A}
.opt:focus-visible{outline:2px solid var(--ame);outline-offset:2px}
.amt{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.amt .opt .t{font-family:"DM Mono",monospace;font-size:15px}

button.go{width:100%;font-family:"Zen Kaku Gothic New",sans-serif;font-size:13.5px;background:none;
  color:var(--kome);border:1px solid var(--kouji);padding:12px;border-radius:2px;cursor:pointer;letter-spacing:.08em}
button.go:hover{background:var(--kouji);color:var(--muro)}
button.go:focus-visible{outline:2px solid var(--ame);outline-offset:3px}

.note{font-size:12.5px;line-height:1.8;color:var(--sub);border-left:2px solid var(--line);padding-left:12px}
.note b{color:var(--kome);font-weight:500}

.overlay{position:absolute;inset:0;background:rgba(8,17,30,.96);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:13px;text-align:center;padding:24px;opacity:0;
  pointer-events:none;transition:opacity .35s;overflow-y:auto}
.overlay.on{opacity:1;pointer-events:auto}
.overlay h2{font-family:"Shippori Mincho B1",serif;font-size:21px;line-height:1.5}
.overlay p{font-size:12.5px;color:var(--sub);line-height:1.9;max-width:430px}
.overlay p b{color:var(--kome)} .overlay p .hi{color:var(--ame)} .overlay p .bad{color:var(--san)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">one enzyme, one substrate</div>
    <h1>乳糖の一点</h1>
    <p class="lede">牛乳の成分は4つの別々の経路で消化されます。うち一つだけが、ラクターゼの担当です。この人が損をしないように出してください。</p>
  </header>

  <div class="who">
    <div class="r" id="rnd">1 / 3</div>
    <div class="n" id="who">—</div>
    <div class="d" id="whoD">—</div>
    <div class="t" id="whoT">—</div>
  </div>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="overlay on" id="ov">
      <h2 id="ovT">乳糖の一点</h2>
      <p id="ovP">形と量を選んで出します。<br><b>栄養は多いほどよく、症状はゼロにしたい。</b></p>
      <button class="go" id="ovB" style="max-width:220px">はじめる</button>
    </div>
  </div>

  <div class="ctl">
    <div class="row">
      <div class="l">形</div>
      <div class="opts" id="forms"></div>
    </div>
    <div class="row">
      <div class="l">量</div>
      <div class="amt" id="amts"></div>
    </div>
    <button class="go" id="serve">出す</button>
  </div>

  <p class="note">
    ラクターゼが分解するのは<b>乳糖だけ</b>です。タンパク質はペプシンとトリプシン、脂質はリパーゼ、
    カルシウムは酵素を使わずに吸収されます。<br>
    分解されなかった乳糖は大腸へ行き、腸内細菌に発酵されてガスになります。<b>不快ではありますが、毒ではありません。</b>
  </p>
</div>

<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const formsEl=document.getElementById('forms'),amtsEl=document.getElementById('amts');
const serve=document.getElementById('serve');
const rndEl=document.getElementById('rnd'),whoEl=document.getElementById('who'),
      whoD=document.getElementById('whoD'),whoT=document.getElementById('whoT');
const ov=document.getElementById('ov'),ovT=document.getElementById('ovT'),ovP=document.getElementById('ovP'),ovB=document.getElementById('ovB');

const FORMS=[
  {k:'milk', n:'牛乳',      s:'乳糖 10g/杯', lac:10.0, col:'#F4EFE2'},
  {k:'yog',  n:'ヨーグルト', s:'乳糖 3g/杯',  lac:3.0,  col:'#C9DCEA'},
  {k:'chz',  n:'熟成チーズ', s:'乳糖 0.2g/杯',lac:0.2,  col:'#E8B33A'},
];
const PEOPLE=[
  {n:'生後6ヶ月の赤ちゃん', d:'ヒトはみな乳児期にラクターゼ活性が最も高い。母乳を消化するための標準装備です。',
   tol:60, hint:'ラクターゼ活性 きわめて高い'},
  {n:'40歳・日本人の成人', d:'離乳後に活性が落ちるのが哺乳類の標準。日本人成人の多くがこの状態です。',
   tol:12, hint:'ラクターゼ活性 低い（一度に12gまで）'},
  {n:'30歳・強い乳糖不耐', d:'活性がさらに低い人。少量でも症状が出ます。',
   tol:4,  hint:'ラクターゼ活性 とても低い（一度に4gまで）'},
];
const LANES=[
  {n:'タンパク質',e:'ペプシン・トリプシン',c:'#8FB8E8'},
  {n:'脂質',      e:'リパーゼ',            c:'#F0A87A'},
  {n:'カルシウム',e:'（酵素不要）',        c:'#7FD1B9'},
  {n:'乳糖',      e:'ラクターゼ',          c:'#E8B33A'},
];

let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',resize);

let form=0,amt=1,round=0,log=[],parts=[],anim=0,running=false,pass=[1,1,1,1],last=0;

FORMS.forEach((f,i)=>{
  const b=document.createElement('button');b.className='opt';b.type='button';
  b.innerHTML=`<div class="t">${f.n}</div><div class="s">${f.s}</div>`;
  b.addEventListener('click',()=>{form=i;paint();});
  formsEl.appendChild(b);
});
[0,1,2,3,4].forEach(v=>{
  const b=document.createElement('button');b.className='opt';b.type='button';
  b.innerHTML=`<div class="t">${v}</div><div class="s">${v===0?'出さない':'杯'}</div>`;
  b.addEventListener('click',()=>{amt=v;paint();});
  amtsEl.appendChild(b);
});
function paint(){
  [...formsEl.children].forEach((b,i)=>b.classList.toggle('sel',i===form));
  [...amtsEl.children].forEach((b,i)=>b.classList.toggle('sel',i===amt));
}

function loadRound(){
  const p=PEOPLE[round];
  rndEl.textContent=(round+1)+' / 3';
  whoEl.textContent=p.n; whoD.textContent=p.d; whoT.textContent=p.hint;
  form=0;amt=1;paint();parts=[];pass=[1,1,1,1];anim=0;
}

serve.addEventListener('click',()=>{
  if(running)return;
  const p=PEOPLE[round],f=FORMS[form];
  const lacTotal=f.lac*amt;
  const digested=Math.min(lacTotal,p.tol);
  const leftover=Math.max(0,lacTotal-p.tol);
  const nutri=amt*10;
  pass=[1,1,1, lacTotal>0?digested/lacTotal:1];
  log.push({person:p.n,form:f.n,amt,nutri,leftover,lacTotal});
  running=true;anim=0;parts=[];
  spawn(amt);
  setTimeout(()=>{
    running=false;
    round++;
    if(round>=PEOPLE.length)finish(); else loadRound();
  },3400);
});

function spawn(a){
  const per=Math.max(4,a*7);
  for(let L=0;L<4;L++)for(let i=0;i<per;i++)
    parts.push({L,x:0,y:-20-Math.random()*160-i*9,v:70+Math.random()*40,stuck:false,ok:Math.random()<pass[L]});
}

function step(dt){
  anim+=dt;
  const gateY=H*0.56;
  for(const p of parts){
    if(p.stuck)continue;
    p.y+=p.v*dt;
    if(p.L===3&&!p.ok&&p.y>gateY){p.y=gateY+2+Math.random()*4;p.stuck=true;}
    if(p.y>H+20)p.y=H+20;
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#0A1524';ctx.fillRect(0,0,W,H);
  const cw=W/4, gateY=H*0.56;
  LANES.forEach((L,i)=>{
    const cx=cw*i+cw/2;
    ctx.strokeStyle='rgba(43,69,104,.55)';ctx.lineWidth=1;
    if(i>0){ctx.beginPath();ctx.moveTo(cw*i,26);ctx.lineTo(cw*i,H);ctx.stroke();}
    ctx.fillStyle='#93A6BE';ctx.font='500 11px "Zen Kaku Gothic New",sans-serif';ctx.textAlign='center';
    ctx.fillText(L.n,cx,17);
    ctx.fillStyle='#4C5F76';ctx.font='400 9px "DM Mono",monospace';
    ctx.fillText(L.e,cx,29);
    ctx.strokeStyle=i===3?'#E8B33A':'rgba(127,209,196,.45)';
    ctx.lineWidth=i===3?2:1.4; ctx.setLineDash(i===3?[]:[3,4]);
    ctx.beginPath();ctx.moveTo(cw*i+9,gateY);ctx.lineTo(cw*(i+1)-9,gateY);ctx.stroke();ctx.setLineDash([]);
    if(i===3){
      const w=(cw-18)*pass[3];
      ctx.strokeStyle='#0A1524';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(cw*i+9,gateY);ctx.lineTo(cw*i+9+w,gateY);ctx.stroke();
    }
  });
  ctx.fillStyle='rgba(43,69,104,.35)';ctx.fillRect(0,H-26,W,26);
  ctx.fillStyle='#4C5F76';ctx.font='400 9.5px "DM Mono",monospace';ctx.textAlign='left';
  ctx.fillText('吸収',10,H-10);
  ctx.textAlign='right';ctx.fillText('大腸へ',W-10,gateY-8);

  for(const p of parts){
    const cx=cw*p.L+cw/2+((p.L*37+p.y*3)%17-8);
    ctx.fillStyle=p.stuck?'#F07A4B':LANES[p.L].c;
    ctx.globalAlpha=p.stuck?0.9:0.85;
    ctx.beginPath();ctx.arc(cx,p.y,3.6,0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function finish(){
  const totN=log.reduce((a,b)=>a+b.nutri,0);
  const totL=log.reduce((a,b)=>a+b.leftover,0);
  const zero=log.filter(l=>l.nutri===0).length;
  let head,body;
  if(totL<=0&&totN>=100){head='すべて通した';}
  else if(totL<=0&&zero>0){head='症状は防いだ。<br>ただし、通っていた3本も止めた';}
  else if(totL<=0){head='症状ゼロ。もっと出せた';}
  else {head='お腹を壊した';}
  body=log.map((l,i)=>
    `<b>${l.person}</b> — ${l.form} ${l.amt}杯　栄養 <span class="hi">${l.nutri}</span>／`+
    `残った乳糖 <span class="${l.leftover>0?'bad':'hi'}">${l.leftover.toFixed(1)}g</span>`).join('<br>');
  ovT.innerHTML=head;
  ovP.innerHTML=body+
    `<br><br>合計 栄養 <b>${totN}</b>／大腸に届いた乳糖 <b>${totL.toFixed(1)}g</b><br><br>`+
    `ラクターゼが担当するのは乳糖だけです。<b>一つの酵素が足りないことは、その食べ物全部が消化できないことを意味しません。</b><br><br>`+
    `そして解決策の一つが<span class="hi">発酵</span>でした。乳酸菌が先に乳糖を食べておいてくれたのがヨーグルトとチーズです。`+
    `消化の悪い大豆に対する味噌と、まったく同じ解き方です。`;
  ov.classList.add('on');
}

function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(running)step(dt);draw();requestAnimationFrame(loop);}
ovB.addEventListener('click',()=>{
  round=0;log=[];loadRound();ov.classList.remove('on');
});
resize();loadRound();last=performance.now();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
