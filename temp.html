<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>麹の 温度</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFF4DA;--paper2:#FFE9B0;--ink:#2A2118;--white:#FFFDF5;
  --red:#FF5C39;--pink:#FF7BA6;--yellow:#FFC42E;--green:#57C84D;
  --blue:#2B6BD6;--cyan:#37C8D4;--purple:#9B6BE8;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);
  background-image:radial-gradient(circle at 90% 8%,rgba(255,92,57,.26) 0 17%,transparent 17.5%),
                   radial-gradient(circle at 8% 62%,rgba(255,196,46,.3) 0 19%,transparent 19.5%);
  color:var(--ink);font-family:"Zen Maru Gothic",system-ui,sans-serif;font-weight:700;
  display:flex;justify-content:center;padding:18px 14px 40px;min-height:100vh}
.wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:13px}
header{text-align:center;position:relative}
h1{font-family:"RocknRoll One",sans-serif;font-size:clamp(27px,7.6vw,38px);line-height:1.16;
  text-shadow:3px 3px 0 var(--yellow)}
h1 em{font-style:normal;color:var(--red);text-shadow:3px 3px 0 var(--ink)}
.sub{font-size:12.5px;margin-top:7px;color:#6B5B45;line-height:1.75}
.mute{position:absolute;right:0;top:0;background:var(--white);border:3px solid var(--ink);border-radius:50%;
  width:38px;height:38px;font-size:16px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);display:grid;
  place-items:center;font-family:inherit;padding:0}
.mute:active{transform:translate(3px,3px);box-shadow:none}

.stage{position:relative;background:var(--white);border:5px solid var(--ink);border-radius:24px;
  box-shadow:7px 7px 0 var(--ink);overflow:hidden}
canvas{display:block;width:100%;height:250px}
.zone{position:absolute;top:11px;right:13px;font-family:"RocknRoll One",sans-serif;font-size:13px;
  border:3px solid var(--ink);border-radius:11px;padding:3px 11px;box-shadow:3px 3px 0 var(--ink)}
.speech{position:absolute;left:50%;transform:translateX(-50%);bottom:11px;background:var(--white);
  border:3px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);padding:6px 14px;
  font-size:13px;font-weight:900;white-space:nowrap;opacity:0;transition:opacity .25s}
.speech.on{opacity:1}

.big{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--white);border:5px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);
  padding:12px 16px}
.temp{font-family:"RocknRoll One",sans-serif;font-size:44px;line-height:1;transition:color .3s}
.temp small{font-size:17px;color:#6B5B45}
.alive{font-size:12px;color:#6B5B45;text-align:right;line-height:1.5}
.alive b{font-family:"RocknRoll One",sans-serif;font-size:26px;color:var(--ink);display:block}

.ctl{background:var(--white);border:5px solid var(--ink);border-radius:20px;
  box-shadow:6px 6px 0 var(--ink);padding:13px 16px 15px}
.ctl .l{font-family:"RocknRoll One",sans-serif;font-size:14px;margin-bottom:11px;
  display:flex;justify-content:space-between}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:14px;border:3px solid var(--ink);border-radius:9px;
  background:linear-gradient(90deg,var(--cyan),var(--yellow),var(--red))}
input[type=range]::-moz-range-track{height:14px;border:3px solid var(--ink);border-radius:9px;
  background:linear-gradient(90deg,var(--cyan),var(--yellow),var(--red))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:32px;background:var(--white);
  border:4px solid var(--ink);border-radius:9px;margin-top:-12px;box-shadow:2px 2px 0 var(--ink)}
input[type=range]::-moz-range-thumb{width:26px;height:32px;background:var(--white);border:4px solid var(--ink);
  border-radius:9px;box-shadow:2px 2px 0 var(--ink)}
input[type=range]:disabled::-webkit-slider-thumb{background:#C9BFAE}
input[type=range]:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
.scale{display:flex;justify-content:space-between;font-size:10.5px;color:#8A7A63}

.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{background:var(--white);border:4px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);
  padding:9px 12px 11px}
.m .l{font-size:11px;color:#6B5B45}
.m .v{font-family:"RocknRoll One",sans-serif;font-size:21px;line-height:1.2}
.bar{height:11px;border:3px solid var(--ink);border-radius:7px;background:#EDE5D3;overflow:hidden;margin-top:5px}
.bar span{display:block;height:100%;width:0%;transition:width .18s linear}
#sugarBar span{background:var(--green)} #sourBar span{background:var(--red)}

.refill{width:100%;font-family:"RocknRoll One",sans-serif;font-size:16px;background:var(--purple);
  color:var(--white);border:4px solid var(--ink);border-radius:16px;padding:12px;cursor:pointer;
  box-shadow:5px 5px 0 var(--ink);transition:transform .07s,box-shadow .07s}
.refill:active{transform:translate(5px,5px);box-shadow:none}
.refill:disabled{background:#C9BFAE;transform:translate(5px,5px);box-shadow:none;cursor:default}
.refillMsg{text-align:center;font-size:12px;color:var(--purple);min-height:17px;font-weight:900}

.note{background:var(--white);border:4px dashed var(--ink);border-radius:18px;padding:13px 15px;
  font-size:12.5px;line-height:1.85;color:#4A3E2E;font-weight:500}
.note b{font-weight:900;color:var(--ink)}

.modal{position:fixed;inset:0;background:rgba(42,33,24,.74);display:grid;place-items:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;overflow-y:auto}
.modal.on{opacity:1;pointer-events:auto}
.card{background:var(--white);border:5px solid var(--ink);border-radius:26px;box-shadow:9px 9px 0 var(--ink);
  padding:24px 20px;max-width:410px;width:100%;text-align:center;
  transform:scale(.72) rotate(-3deg);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.modal.on .card{transform:scale(1) rotate(0)}
.card .tag{display:inline-block;font-family:"RocknRoll One",sans-serif;font-size:12px;
  border:3px solid var(--ink);border-radius:11px;padding:3px 12px;box-shadow:2px 2px 0 var(--ink)}
.card.ok .tag{background:var(--green)} .card.ng .tag{background:var(--red);color:var(--white)}
.card .ic{font-size:64px;line-height:1;margin:12px 0 3px}
.card h2{font-family:"RocknRoll One",sans-serif;font-size:25px;margin-bottom:11px}
.card.ok h2{color:var(--green)} .card.ng h2{color:var(--red)}
.card p{font-size:13px;line-height:1.9;color:#4A3E2E;text-align:left}
.card .warn{background:#F3EBFF;border:3px solid var(--purple);border-radius:13px;padding:10px 12px;
  margin-top:11px;text-align:left;font-size:12.5px;line-height:1.85}
.go{width:100%;font-family:"RocknRoll One",sans-serif;font-size:19px;letter-spacing:.12em;background:var(--red);
  color:var(--white);border:4px solid var(--ink);border-radius:17px;padding:13px;cursor:pointer;
  box-shadow:6px 6px 0 var(--ink);transition:transform .07s,box-shadow .07s;margin-top:16px}
.go:active{transform:translate(6px,6px);box-shadow:none}
.conf{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.cf{position:absolute;width:11px;height:15px;border:2px solid var(--ink);border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="mute" id="mute" type="button" aria-label="音">🔊</button>
    <h1>麹の<br><em>温度</em></h1>
    <p class="sub">動かせるのは <b>ヒーターの つまみ</b>だけ。<br>鍋には 熱の慣性が ある。</p>
  </header>

  <div class="stage">
    <div class="zone" id="zone" style="background:#37C8D4">さむい</div>
    <canvas id="cv"></canvas>
    <div class="speech" id="speech"></div>
  </div>

  <div class="big">
    <div class="temp" id="tempV">35<small>℃</small></div>
    <div class="alive">元気な 麹菌<b><span id="aliveV">24</span> / 24</b></div>
  </div>

  <div class="ctl">
    <div class="l"><span>🔥 ヒーター</span><span id="heatV">0%</span></div>
    <input type="range" id="heat" min="0" max="100" value="0" step="1" aria-label="ヒーター出力">
    <div class="scale"><span>0</span><span>50</span><span>100</span></div>
  </div>

  <div class="meters">
    <div class="m"><div class="l">🍯 甘さ</div><div class="v"><span id="sugarV">0</span> / 100</div>
      <div class="bar" id="sugarBar"><span></span></div></div>
    <div class="m"><div class="l">😖 酸っぱさ</div><div class="v"><span id="sourV">0</span> / 100</div>
      <div class="bar" id="sourBar"><span></span></div></div>
  </div>

  <button class="refill" id="refill" type="button">💊 酵素を 補充する</button>
  <div class="refillMsg" id="refillMsg"></div>

  <p class="note">
    <b>50℃を 下まわると</b> 乳酸菌が 増えて 酸っぱくなる。
    <b>66℃を こえると</b> 麹の 酵素が ほどけて、色が ぬけて <b>もう 二度と 戻らない</b>。<br>
    一番 はやいのは 58℃あたり。ほんものの 甘酒づくりで「55〜60℃を 守れ」と いわれるのは、
    この 二つの がけの あいだが せまいから。
  </p>
</div>

<div class="modal" id="modal"><div class="card" id="card"></div></div>
<div class="conf" id="conf"></div>

<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const heat=document.getElementById('heat'),heatV=document.getElementById('heatV');
const tempV=document.getElementById('tempV'),zoneEl=document.getElementById('zone'),speech=document.getElementById('speech');
const aliveV=document.getElementById('aliveV'),sugarV=document.getElementById('sugarV'),sourV=document.getElementById('sourV');
const sugarBar=document.querySelector('#sugarBar span'),sourBar=document.querySelector('#sourBar span');
const refill=document.getElementById('refill'),refillMsg=document.getElementById('refillMsg');
const modal=document.getElementById('modal'),card=document.getElementById('card');

let ac=null,muted=false;
function snd(f,d,t,v){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=t||'square';o.frequency.value=f;
  g.gain.setValueAtTime(v||.05,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function blip(){snd(660,.06,'square',.05)}
function pop(){snd(420+Math.random()*300,.08,'sine',.04)}
function die(){snd(160,.22,'sawtooth',.05)}
function fanfare(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,.23,'square',.06),i*105))}
function thud(){snd(140,.22,'sawtooth',.055);setTimeout(()=>snd(90,.3,'sawtooth',.05),110)}
document.getElementById('mute').addEventListener('click',e=>{muted=!muted;
  e.currentTarget.textContent=muted?'🔇':'🔊';if(!muted)blip();});

let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',resize);

const N=24,LIMIT=150;
let enz=[],glu=[],T=35,sugar=0,sour=0,t=0,over=false,last=0,lock=0,refills=0,peakT=35,spT=0,said={};

function say(s){speech.textContent=s;speech.classList.add('on');spT=2.3;}
function reset(){
  resize();enz=[];
  for(let i=0;i<N;i++)enz.push({x:24+Math.random()*(W-48),y:44+Math.random()*(H-88),
    vx:(Math.random()-.5)*24,vy:(Math.random()-.5)*24,alive:true,fade:1,ph:Math.random()*6.28});
  glu=[];T=35;sugar=0;sour=0;t=0;over=false;heat.value=0;lock=0;refills=0;peakT=35;said={};
  heat.disabled=false;refill.disabled=false;refillMsg.textContent='';
  modal.classList.remove('on');last=performance.now();say('さむい… もっと 温めて');
}
function act(x){return Math.exp(-Math.pow((x-58)/14,2));}

refill.addEventListener('click',()=>{if(over||lock>0)return;
  refills++;lock=8;heat.disabled=true;refill.disabled=true;blip();say('えっ、増えてない…？');});

function step(dt){
  if(spT>0){spT-=dt;if(spT<=0)speech.classList.remove('on');}
  if(lock>0){lock-=dt;refillMsg.textContent=lock>0?'投入中… '+lock.toFixed(1)+'秒':'';
    if(lock<=0){heat.disabled=false;refill.disabled=false;refillMsg.textContent='';}}
  const h=lock>0?0:+heat.value;
  T+=(h*0.0876-(T-22)*0.12)*dt;
  if(T>peakT)peakT=T;
  const a=act(T);let alive=0;
  for(const e of enz){
    if(e.alive){alive++;
      if(T>66){const p=Math.pow((T-66)/8,2)*1.4;if(Math.random()<p*dt){e.alive=false;die();}}
      const sp=.6+a*1.5;
      e.x+=e.vx*dt*sp;e.y+=e.vy*dt*sp;
      if(e.x<24||e.x>W-24)e.vx*=-1;if(e.y<30||e.y>H-30)e.vy*=-1;
      e.x=Math.max(24,Math.min(W-24,e.x));e.y=Math.max(30,Math.min(H-30,e.y));
      e.ph+=dt*3;
    }else if(e.fade>0){e.fade=Math.max(0,e.fade-dt*1.1);e.y=Math.min(H-26,e.y+dt*9);}
  }
  if(sugar<100){const rate=alive*a*.16;sugar=Math.min(100,sugar+rate*dt);
    if(Math.random()<rate*dt*.4&&glu.length<70){glu.push({x:Math.random()*W,y:H-8,v:16+Math.random()*22,l:1});pop();}}
  if(T<50)sour=Math.min(100,sour+(50-T)*.05*dt);
  for(const g of glu){g.y-=g.v*dt;g.l-=dt*.26;}
  glu=glu.filter(g=>g.l>0);
  t+=dt;
  if(!said.hot&&T>66){said.hot=1;say('あつい！ あつい！');}
  if(!said.good&&T>=55&&T<=62){said.good=1;say('いいかんじ！ ぐんぐん 甘くなる！');}
  if(!said.cold&&t>18&&T<50){said.cold=1;say('さむい… 酸っぱくなっちゃう');}
  return alive;
}

function face(x,y,s,mode){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.strokeStyle='#2A2118';ctx.lineWidth=2;ctx.lineCap='round';ctx.fillStyle='#2A2118';
  if(mode==='dead'){
    ctx.beginPath();ctx.moveTo(-7,-4);ctx.lineTo(-2,1);ctx.moveTo(-2,-4);ctx.lineTo(-7,1);
    ctx.moveTo(2,-4);ctx.lineTo(7,1);ctx.moveTo(7,-4);ctx.lineTo(2,1);ctx.stroke();
    ctx.beginPath();ctx.arc(0,6,3,Math.PI,0);ctx.stroke();
  }else if(mode==='hot'){
    ctx.beginPath();ctx.moveTo(-7.4,-5);ctx.lineTo(-2.4,-1.6);ctx.moveTo(2.4,-1.6);ctx.lineTo(7.4,-5);ctx.stroke();
    ctx.beginPath();ctx.ellipse(0,5,3.4,3,0,0,6.283);ctx.fill();
  }else if(mode==='cold'){
    ctx.beginPath();ctx.arc(-4.4,-3,2.1,0,6.283);ctx.arc(4.4,-3,2.1,0,6.283);ctx.fill();
    ctx.beginPath();ctx.moveTo(-4,6);ctx.lineTo(4,6);ctx.stroke();
  }else{
    ctx.beginPath();ctx.arc(-4.4,-3,2.2,0,6.283);ctx.arc(4.4,-3,2.2,0,6.283);ctx.fill();
    ctx.beginPath();ctx.moveTo(-4,3.4);ctx.quadraticCurveTo(0,7.6,4,3.4);ctx.stroke();
  }
  ctx.restore();
}
function drawKoji(e,mode){
  const s=e.alive?(1+Math.sin(e.ph)*.09*act(T)):1;
  const col=e.alive?'#FFFDF5':'#C3B79F',fur=e.alive?'#57C84D':'#A99C86';
  ctx.globalAlpha=e.alive?1:e.fade;
  ctx.strokeStyle='#2A2118';ctx.lineWidth=2.6;ctx.lineCap='round';
  for(let i=0;i<8;i++){const a=i/8*6.283+(e.alive?Math.sin(e.ph+i)*.1:0);
    ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+Math.cos(a)*15*s,e.y+Math.sin(a)*15*s);ctx.stroke();}
  ctx.fillStyle=col;ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(e.x,e.y,11*s,0,6.283);ctx.fill();ctx.stroke();
  ctx.fillStyle=fur;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(e.x-2,e.y-11*s);ctx.quadraticCurveTo(e.x+1,e.y-19*s,e.x+4.5,e.y-20*s);
  ctx.quadraticCurveTo(e.x+2,e.y-14*s,e.x+2,e.y-11*s);ctx.closePath();ctx.fill();ctx.stroke();
  face(e.x,e.y+1,.95*s,mode);
  ctx.globalAlpha=1;
}

function draw(alive,tt){
  const warm=Math.max(0,Math.min(1,(T-30)/50));
  ctx.fillStyle='rgb(255,'+Math.round(248-warm*46)+','+Math.round(226-warm*74)+')';
  ctx.fillRect(0,0,W,H);
  if(T>62){for(let i=0;i<4;i++){
    ctx.strokeStyle='rgba(255,92,57,'+(.28+Math.sin(tt*2+i)*.24).toFixed(2)+')';
    ctx.lineWidth=4;ctx.lineCap='round';
    const x=44+i*(W-88)/3;
    ctx.beginPath();ctx.moveTo(x,28);ctx.quadraticCurveTo(x+9,17,x,6);ctx.stroke();}}
  for(const g of glu){ctx.globalAlpha=Math.max(0,g.l);ctx.fillStyle='#57C84D';ctx.strokeStyle='#2A2118';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(g.x,g.y,4.4,0,6.283);ctx.fill();ctx.stroke();}
  ctx.globalAlpha=1;
  const mode=T>66?'hot':T<50?'cold':'ok';
  for(const e of enz)if(!e.alive&&e.fade>0)drawKoji(e,'dead');
  for(const e of enz)if(e.alive)drawKoji(e,mode);

  heatV.textContent=heat.value+'%';
  tempV.innerHTML=T.toFixed(1)+'<small>℃</small>';
  aliveV.textContent=alive;sugarV.textContent=Math.floor(sugar);sourV.textContent=Math.floor(sour);
  sugarBar.style.width=sugar+'%';sourBar.style.width=sour+'%';
  let z,c,tc='#2A2118';
  if(T<50){z='さむい';c='#37C8D4';}
  else if(T<55){z='まだ おそい';c='#FFE9B0';}
  else if(T<=62){z='最高！';c='#57C84D';}
  else if(T<=66){z='きわどい';c='#FFC42E';}
  else{z='あつすぎ！';c='#FF5C39';tc='#FF5C39';}
  zoneEl.textContent=z;zoneEl.style.background=c;tempV.style.color=tc;
}

function confetti(){const box=document.getElementById('conf'),
  cols=['#FF5C39','#FFC42E','#57C84D','#2B6BD6','#FF7BA6','#37C8D4'];
  for(let i=0;i<58;i++){const d=document.createElement('div');d.className='cf';
    d.style.background=cols[(Math.random()*cols.length)|0];d.style.left=(Math.random()*100)+'%';d.style.top='-24px';
    box.appendChild(d);
    d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},
      {transform:'translate('+((Math.random()-.5)*260)+'px,'+(innerHeight+70)+'px) rotate('+(Math.random()*900-450)+'deg)',opacity:.95}],
      {duration:1300+Math.random()*800,easing:'cubic-bezier(.25,.6,.5,1)'}).onfinish=()=>d.remove();}}

function finish(ok,ic,title,msg){
  over=true;heat.disabled=false;refill.disabled=false;refillMsg.textContent='';
  if(ok){fanfare();confetti();}else thud();
  let extra='';
  if(refills>0)extra='<div class="warn">「酵素を 補充する」を <b>'+refills+'かい</b> おした。'+
    'でも <b>いちども 増えてない</b>。<br>酵素は 働いても 減らないから、補充する 相手が いない。'+
    '失ったのは <b>'+(refills*8)+'秒</b>だけ。</div>';
  card.className='card '+(ok?'ok':'ng');
  card.innerHTML='<div class="tag">'+(ok?'成功！':'ざんねん')+'</div><div class="ic">'+ic+'</div>'+
    '<h2>'+title+'</h2><p>'+msg+'</p>'+extra+'<button class="go" id="again">もういちど</button>';
  modal.classList.add('on');
  document.getElementById('again').addEventListener('click',reset);
}

function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const tt=now/1000;
  if(!over){
    const alive=step(dt);draw(alive,tt);
    if(sugar>=100)finish(1,'🍯','甘くなった！',
      t.toFixed(0)+'秒。生き残った 麹菌 <b>'+alive+'匹</b>が 最後まで 働いた。<br>'+
      '酵素は 相手を 変えるけど、じぶんは 変わらない。だから <b>'+alive+'匹で 100の とう</b>が つくれる。');
    else if(sour>=100)finish(0,'😖','酸っぱくなった',
      '50℃を したまわった 時間が ながすぎた。麹菌は ぶじでも、乳酸菌が 先に お米を 食べてしまった。');
    else if(alive===0)finish(0,'💀','もう 甘くならない',
      '麹菌が 全滅。最高温度 <b>'+peakT.toFixed(1)+'℃</b>。<br>'+
      '<b>変性は もとに 戻らない</b>。冷やしても 形は たたみなおされない。'+
      'ここが「にて 殺菌」と「温めすぎて だいなし」の 境目。');
    else if(t>=LIMIT)finish(0,'⏰','時間ぎれ',
      '甘さ '+Math.floor(sugar)+'。麹菌は いきてるけど、反応の スピードが たりなかった。'+
      '<b>58℃あたりを どれだけ ながく 保てるか</b>が きく。');
  }
  requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
})();
</script>
