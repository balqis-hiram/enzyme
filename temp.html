<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>麹の温度 — アミラーゼの生死</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --muro:#12233A; --muro2:#1B3050; --line:#2B4568;
  --kome:#F4EFE2; --sub:#93A6BE;
  --kouji:#E8B33A; --ame:#7FD1B9; --shi:#4C5F76; --netsu:#F07A4B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--muro); color:var(--kome);
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
  display:flex; justify-content:center;
  padding:20px 16px 32px;
  -webkit-font-smoothing:antialiased;
}
.wrap{width:100%;max-width:620px;display:flex;flex-direction:column;gap:18px}

header{border-bottom:1px solid var(--line);padding-bottom:14px}
.eyebrow{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.18em;color:var(--kouji);text-transform:uppercase}
h1{font-family:"Shippori Mincho B1",serif;font-size:30px;font-weight:700;letter-spacing:.04em;margin-top:6px}
.lede{color:var(--sub);font-size:13.5px;line-height:1.7;margin-top:8px}

.stage{position:relative;border:1px solid var(--line);border-radius:3px;background:#0D1B2E;overflow:hidden}
canvas{display:block;width:100%;height:230px}

.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meter{border:1px solid var(--line);padding:10px 12px;background:var(--muro2);border-radius:2px}
.meter .lab{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--sub)}
.meter .val{font-family:"DM Mono",monospace;font-size:22px;margin-top:2px}
.bar{height:4px;background:#0D1B2E;margin-top:8px;overflow:hidden}
.bar span{display:block;height:100%;width:0%;transition:width .18s linear}
#sugarBar span{background:var(--ame)}
#sourBar span{background:var(--netsu)}

.readout{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.temp{font-family:"DM Mono",monospace;font-size:52px;line-height:1;letter-spacing:-.02em;transition:color .3s}
.temp small{font-size:18px;color:var(--sub);margin-left:4px}
.zone{font-size:12px;font-family:"DM Mono",monospace;letter-spacing:.1em;padding:4px 9px;border:1px solid currentColor;border-radius:2px}
.alive{font-family:"DM Mono",monospace;font-size:13px;color:var(--sub)}
.alive b{color:var(--kouji);font-weight:500;font-size:17px}

.control label{display:block;font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--sub);margin-bottom:10px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:linear-gradient(90deg,var(--line),var(--kouji));border-radius:3px}
input[type=range]::-moz-range-track{height:6px;background:linear-gradient(90deg,var(--line),var(--kouji));border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:26px;background:var(--kome);border-radius:2px;margin-top:-10px;border:none}
input[type=range]::-moz-range-thumb{width:14px;height:26px;background:var(--kome);border-radius:2px;border:none}
input[type=range]:focus-visible{outline:2px solid var(--ame);outline-offset:4px}
.scale{display:flex;justify-content:space-between;font-family:"DM Mono",monospace;font-size:10px;color:var(--shi);margin-top:2px}

.refill{width:100%;font-family:"Zen Kaku Gothic New",sans-serif;font-size:13px;background:var(--muro2);
  color:var(--kome);border:1px solid var(--kouji);padding:11px;border-radius:2px;cursor:pointer;letter-spacing:.06em}
.refill:hover{background:var(--kouji);color:var(--muro)}
.refill:disabled{opacity:.4;cursor:default;background:var(--muro2);color:var(--sub);border-color:var(--line)}
.refillMsg{font-family:"DM Mono",monospace;font-size:11.5px;color:var(--netsu);min-height:16px;margin-top:-8px;text-align:center}
.note{font-size:12.5px;line-height:1.8;color:var(--sub);border-left:2px solid var(--line);padding-left:12px}
.note b{color:var(--kome);font-weight:500}

.overlay{position:absolute;inset:0;background:rgba(11,23,38,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .35s}
.overlay.on{opacity:1;pointer-events:auto}
.overlay h2{font-family:"Shippori Mincho B1",serif;font-size:24px;font-weight:700}
.overlay p{font-size:13px;color:var(--sub);line-height:1.8;max-width:400px}
button{font-family:"Zen Kaku Gothic New",sans-serif;font-size:13px;background:none;color:var(--kome);border:1px solid var(--kouji);padding:9px 22px;border-radius:2px;cursor:pointer;letter-spacing:.06em}
button:hover{background:var(--kouji);color:var(--muro)}
button:focus-visible{outline:2px solid var(--ame);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">koji / amylase</div>
    <h1>麹の温度</h1>
    <p class="lede">米麹のアミラーゼがデンプンをブドウ糖に変える。あなたが動かせるのはヒーターの出力だけで、温度そのものではない。鍋には熱の慣性がある。</p>
  </header>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT"></h2>
      <p id="ovP"></p>
      <button id="ovB">もう一度</button>
    </div>
  </div>

  <div class="readout">
    <div class="temp" id="tempV">35<small>°C</small></div>
    <div class="zone" id="zone">低い</div>
    <div class="alive">生きている酵素 <b id="aliveV">24</b> / 24</div>
  </div>

  <div class="control">
    <label for="heat">ヒーター出力</label>
    <input type="range" id="heat" min="0" max="100" value="0" step="1" aria-label="ヒーター出力">
    <div class="scale"><span>0%</span><span>50%</span><span>100%</span></div>
  </div>

  <button id="refill" class="refill" type="button">酵素を補充する</button>
  <div class="refillMsg" id="refillMsg"></div>

  <div class="meters">
    <div class="meter">
      <div class="lab">糖度 / SWEETNESS</div>
      <div class="val"><span id="sugarV">0</span> <span style="font-size:13px;color:var(--sub)">/ 100</span></div>
      <div class="bar" id="sugarBar"><span></span></div>
    </div>
    <div class="meter">
      <div class="lab">酸敗 / SOURING</div>
      <div class="val"><span id="sourV">0</span> <span style="font-size:13px;color:var(--sub)">/ 100</span></div>
      <div class="bar" id="sourBar"><span></span></div>
    </div>
  </div>

  <p class="note">
    <b>50℃を下回ると</b>乳酸菌が増えて酸っぱくなる。<b>66℃を超えると</b>アミラーゼがほどけ始め、ほどけた酵素は色を失って二度と戻らない。冷ましても甘くはならない。<br>
    最速は58℃前後。実際の甘酒づくりで「55〜60℃を保て」と言われるのは、この二つの崖の間が狭いから。
  </p>
</div>

<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const heat=document.getElementById('heat');
const tempV=document.getElementById('tempV'),zoneEl=document.getElementById('zone');
const aliveV=document.getElementById('aliveV'),sugarV=document.getElementById('sugarV'),sourV=document.getElementById('sourV');
const sugarBar=document.querySelector('#sugarBar span'),sourBar=document.querySelector('#sourBar span');
const ov=document.getElementById('ov'),ovT=document.getElementById('ovT'),ovP=document.getElementById('ovP'),ovB=document.getElementById('ovB');

let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',resize);

const N=24;
const refill=document.getElementById('refill'),refillMsg=document.getElementById('refillMsg');
let enz=[],glu=[],T=35,sugar=0,sour=0,t=0,over=false,raf=null,last=0,lock=0,refills=0;
const LIMIT=150;
refill.addEventListener('click',()=>{
  if(over||lock>0)return;
  refills++;lock=8;heat.disabled=true;refill.disabled=true;
});

function reset(){
  resize();
  enz=[];for(let i=0;i<N;i++)enz.push({x:Math.random()*W,y:30+Math.random()*(H-60),
    vx:(Math.random()-.5)*22,vy:(Math.random()-.5)*22,alive:true,fade:1,ph:Math.random()*6.28});
  glu=[];T=35;sugar=0;sour=0;t=0;over=false;heat.value=0;ov.classList.remove('on');
  lock=0;refills=0;heat.disabled=false;refill.disabled=false;refillMsg.textContent='';
  last=performance.now();if(!raf)raf=requestAnimationFrame(loop);
}
function act(T){return Math.exp(-Math.pow((T-58)/14,2));}

function step(dt){
  if(lock>0){lock-=dt;if(lock<=0){heat.disabled=false;refill.disabled=false;refillMsg.textContent='';}
    else{refillMsg.textContent='投入中… '+lock.toFixed(1)+'秒';}}
  const h=lock>0?0:+heat.value;
  T += (h*0.0876 - (T-22)*0.12)*dt;
  const a=act(T);
  let alive=0;
  for(const e of enz){
    if(e.alive){
      alive++;
      if(T>66){const p=Math.pow((T-66)/8,2)*1.4;if(Math.random()<p*dt)e.alive=false;}
      const sp=0.6+a*1.4;
      e.x+=e.vx*dt*sp;e.y+=e.vy*dt*sp;
      if(e.x<8||e.x>W-8)e.vx*=-1;if(e.y<14||e.y>H-14)e.vy*=-1;
      e.x=Math.max(8,Math.min(W-8,e.x));e.y=Math.max(14,Math.min(H-14,e.y));
      e.ph+=dt*3;
    } else if(e.fade>0){ e.fade=Math.max(0,e.fade-dt*1.2); e.x+=e.vx*dt*.12; e.y+=dt*6; e.y=Math.min(H-14,e.y); }
  }
  if(sugar<100){
    const rate=alive*a*0.16;
    sugar=Math.min(100,sugar+rate*dt);
    if(Math.random()<rate*dt*0.5&&glu.length<160)
      glu.push({x:Math.random()*W,y:H-8,v:14+Math.random()*20,r:1.4+Math.random()*1.4,l:1});
  }
  if(T<50) sour=Math.min(100,sour+(50-T)*0.05*dt);
  for(const g of glu){g.y-=g.v*dt;g.l-=dt*0.24;}
  glu=glu.filter(g=>g.l>0);
  t+=dt;
  return alive;
}

function draw(alive){
  ctx.clearRect(0,0,W,H);
  const warm=Math.max(0,Math.min(1,(T-40)/45));
  const g=ctx.createLinearGradient(0,H,0,0);
  g.addColorStop(0,`rgba(${18+warm*70},${35+warm*28},${58-warm*14},1)`);
  g.addColorStop(1,'#0D1B2E');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  ctx.globalAlpha=.5;
  for(const p of glu){ctx.globalAlpha=p.l*.7;ctx.fillStyle='#7FD1B9';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;

  for(const e of enz){
    if(e.alive){
      const pulse=1+Math.sin(e.ph)*0.12*act(T);
      ctx.fillStyle='#E8B33A';
      ctx.beginPath();ctx.arc(e.x,e.y,6.5*pulse,0,6.283);ctx.fill();
      ctx.fillStyle='#0D1B2E';
      ctx.beginPath();ctx.arc(e.x+3.4,e.y-1.6,2.6,0,6.283);ctx.fill();
    } else if(e.fade>0){
      ctx.globalAlpha=e.fade*.8;
      ctx.strokeStyle='#4C5F76';ctx.lineWidth=1.6;
      ctx.beginPath();
      for(let i=0;i<=10;i++){const ang=i/10*6.283;const rr=6+Math.sin(i*2.1+e.ph)*3.5;
        const px=e.x+Math.cos(ang)*rr,py=e.y+Math.sin(ang)*rr;
        i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
      ctx.stroke();ctx.globalAlpha=1;
    }
  }
  if(T>66){ctx.fillStyle=`rgba(240,122,75,${Math.min(.16,(T-66)/70)})`;ctx.fillRect(0,0,W,H);}
}

function ui(alive){
  tempV.innerHTML=T.toFixed(1)+'<small>°C</small>';
  aliveV.textContent=alive;
  sugarV.textContent=Math.floor(sugar);
  sourV.textContent=Math.floor(sour);
  sugarBar.style.width=sugar+'%';
  sourBar.style.width=sour+'%';
  let z,c;
  if(T<50){z='酸敗する';c='#F07A4B';}
  else if(T<55){z='まだ遅い';c='#93A6BE';}
  else if(T<=62){z='最適';c='#7FD1B9';}
  else if(T<=66){z='際どい';c='#E8B33A';}
  else {z='変性中';c='#F07A4B';}
  zoneEl.textContent=z;zoneEl.style.color=c;
  tempV.style.color=T>66?'#F07A4B':'var(--kome)';
}

function finish(title,msg){
  over=true;heat.disabled=false;refill.disabled=false;refillMsg.textContent='';
  if(refills>0) msg+=`<br><br><span style="color:#F07A4B">「酵素を補充する」を ${refills} 回押しました。`+
    `一度も増えていません。酵素は働いても減らないので、補充する対象がありません。`+
    `失ったのは ${(refills*8)}秒 だけです。</span>`;
  ovT.textContent=title;ovP.innerHTML=msg;ov.classList.add('on');
}

function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!over){
    const alive=step(dt);
    draw(alive);ui(alive);
    if(sugar>=100) finish('甘くなった',`${t.toFixed(0)}秒。生き残ったアミラーゼ ${alive} 個が、最後まで働き続けた。<br>酵素は基質を変えるが、自分は変わらない。だから ${alive} 個で 100 の糖ができる。`);
    else if(sour>=100) finish('酸っぱくなった','50℃を下回った時間が長すぎた。アミラーゼは無事でも、乳酸菌が先に米を食べてしまった。');
    else if(alive===0) finish('もう甘くならない','アミラーゼが全部ほどけた。<br>変性は不可逆で、温度を下げても畳み直されない。ここが「煮沸して殺菌」と「加熱しすぎて台無し」の境目。');
    else if(t>=LIMIT) finish('時間切れ',`糖度 ${Math.floor(sugar)}。酵素は生きているが、反応速度が足りなかった。58℃前後をどれだけ長く保てるかが効く。`);
  }
  raf=requestAnimationFrame(loop);
}
ovB.addEventListener('click',reset);
reset();
})();
</script>
</body>
</html>
